version: '3.8'

services:

  # ── MySQL Database ──────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: docqa-mysql
    environment:
      MYSQL_ROOT_PASSWORD: yourpassword
      MYSQL_DATABASE: docqa_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot Backend ─────────────────────────────────────────────────────
  backend:
    build: .
    container_name: docqa-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/docqa_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: yourpassword
      OPENAI_API_KEY: ${OPENAI_API_KEY}   # set in .env file
      JWT_SECRET: MyVerySecretKeyForJWTTokenGenerationDocQA2024!
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads-data:/app/uploads

  # ── React Frontend ──────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: docqa-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql-data:
  uploads-data:
